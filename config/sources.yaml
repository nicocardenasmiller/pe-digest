# Working paper series and preprint servers, resolved by name search in OpenAlex.
# `keyword_filter: true` restricts a high-volume repository to items matching the
# keyword query below, so SSRN and arXiv don't flood the pull.
# Matching: `search` first, then each `alt_searches` entry; a match needs a name
# similarity of 0.7 or more. To pin a source, add `openalex_id: "S..."` (see
# data/diagnostics.md for candidate IDs).
#
# Not in OpenAlex as working paper series (checked 2026-11-06): CEPR Discussion
# Papers (only CEPR eBooks exist), IZA Discussion Papers (only IZA journals),
# IDB Working Papers (only an IDB eBooks record, 0 items in window).
working_papers:
  - {name: "National Bureau of Economic Research", search: "National Bureau of Economic Research",
     openalex_id: "S2809516038", keyword_filter: false}   # NBER repository, ~34k works
  - {name: "CESifo Working Papers", search: "CESifo Working Paper", keyword_filter: false,
     alt_searches: ["CESifo Working Paper Series", "CESifo"]}
  - {name: "IMF Working Papers", search: "IMF Working Papers", keyword_filter: false}
  - {name: "World Bank Policy Research Working Papers", search: "World Bank policy research working paper",
     openalex_id: "S4210231086", keyword_filter: false}
  - {name: "SocArXiv", search: "SocArXiv", keyword_filter: true}
  - {name: "SSRN", search: "SSRN Electronic Journal", keyword_filter: true}
  - {name: "arXiv", search: "arXiv (Cornell University)", keyword_filter: true}

# Used only for keyword-filtered repositories. OpenAlex boolean search syntax.
keyword_query: >-
  (trade OR tariff OR globalization OR "foreign direct investment" OR FDI OR multinational
  OR "supply chain" OR "capital mobility" OR immigration OR migration OR redistribution
  OR "political trust" OR "Latin America" OR Chile OR "survey experiment" OR conjoint)
  AND (political OR politics OR preferences OR attitudes OR opinion OR voters)
