# Sources pulled weekly from OpenAlex.
# Journals are resolved by ISSN first, then by name if the ISSN lookup fails or
# returns a different title. The resolution is cached in config/resolved_sources.json
# and reported in data/resolution_report.md. Check that report after the first run.

lookback_days: 14          # window for new items; dedupe against data/seen.json handles overlap
rising_window_days: [90, 365]
rising_top_n: 15
prefilter_keep: 80         # max candidates handed to the scorer each week

