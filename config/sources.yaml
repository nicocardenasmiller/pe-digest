  - {name: "Socio-Economic Review", issn: "1475-1461", tier: 1}
  - {name: "Journal of European Public Policy", issn: "1350-1763", tier: 1}
  - {name: "Economics & Politics", issn: "0954-1985", tier: 1}
  - {name: "Business and Politics", issn: "1469-3569", tier: 1}
  - {name: "The Journal of Politics", issn: "0022-3816", tier: 1}
  - {name: "Comparative Political Studies", issn: "0010-4140", tier: 1}
