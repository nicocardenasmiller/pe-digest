name: Weekly collect

on:
  schedule:
    - cron: "17 22 * * 0"   # Sundays 22:17 UTC, ahead of the Monday digest
  workflow_dispatch: {}      # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Collect
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python collector/collect.py
      - name: Commit output
        run: |
          git config user.name "pe-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data config/resolved_sources.json
          git diff --cached --quiet || git commit -m "Weekly collect $(date -u +%F)"
          git push
